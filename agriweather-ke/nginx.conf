server {
    listen 80;

    root  /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------
    # SPA routing — send all non-file requests to index.html
    # so React Router handles navigation client-side.
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------
    # Static assets — long-lived cache with immutable flag.
    # Vite appends a content hash to filenames so this is safe.
    # -------------------------------------------------------
    location ~* \.(js|css|png|svg|ico|woff2|woff|ttf|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------
    # Security headers
    # -------------------------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"          always;
    add_header X-XSS-Protection       "1; mode=block"    always;

    # -------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------
    gzip              on;
    gzip_min_length   1000;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/x-javascript
        image/svg+xml
        text/xml
        application/xml;
}
